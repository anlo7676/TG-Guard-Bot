name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: tgguard_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:8.6.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          TEST_MYSQL_DSN: root:test-password@tcp(127.0.0.1:3306)/tgguard_test?parseTime=true
          TEST_REDIS_ADDR: 127.0.0.1:6379
      - run: go build ./cmd/tgguard
      - run: docker build -t tgguard:test .
