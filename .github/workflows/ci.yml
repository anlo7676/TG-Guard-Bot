name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: tgguard_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:8.6.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Go formatting
        run: |
          files=$(gofmt -l cmd internal)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - run: node --check internal/api/web/app.js
      - run: node --test scripts/web-authorization.test.cjs
      - run: bash -n scripts/deploy.sh
      - run: bash -n install.sh
      - run: bash -n scripts/manage.sh
      - run: node --test scripts/manage.test.cjs
      - run: node --test scripts/deploy.test.cjs
      - run: node --test scripts/install.test.cjs
      - run: node --test scripts/release.test.cjs
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: go test -race -count=1 -coverpkg=./... -coverprofile=coverage.out ./...
        env:
          TEST_MYSQL_DSN: root:test-password@tcp(127.0.0.1:3306)/tgguard_test?parseTime=true
          TEST_REDIS_ADDR: 127.0.0.1:6379
      - name: Coverage report
        run: go tool cover -func=coverage.out | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
      - run: go build ./cmd/tgguard
      - name: Validate HTTPS deployment configuration
        env:
          PANEL_DOMAIN: panel.example.com
        run: |
          cp .env.example .env
          docker compose -f compose.yaml -f compose.https.yaml config --quiet
      - run: docker build -f Dockerfile.source -t tgguard:test .
