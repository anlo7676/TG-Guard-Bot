name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  binaries:
    concurrency:
      group: stable-release-publication
      cancel-in-progress: false
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
      - run: go test ./...
      - run: go vet ./...
      - name: Build Linux binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w -X tgguard/internal/buildinfo.Version=$version -X tgguard/internal/buildinfo.Source=${GITHUB_SHA:0:12} -X tgguard/internal/buildinfo.BuiltAt=$built_at" -o "dist/tgguard-linux-$arch" ./cmd/tgguard
          done
          cd dist
          sha256sum tgguard-linux-* > SHA256SUMS
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/release.sh upload
      - name: Verify published runtime image
        run: docker build --build-arg RELEASE_VERSION="$GITHUB_REF_NAME" -t tgguard:release .
      - name: Smoke test runtime binary
        run: docker run --rm tgguard:release -h
      - name: Promote validated stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh promote
