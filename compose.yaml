x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  mysql:
    logging: *default-logging
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tgguard
      MYSQL_USER: tgguard
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -utgguard -D tgguard -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [backend]
  redis:
    logging: *default-logging
    image: redis:8.6.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
  app:
    image: tg-guard:1.14.1
    logging: *default-logging
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_DSN: "tgguard:${MYSQL_PASSWORD}@tcp(mysql:3306)/tgguard?parseTime=true&charset=utf8mb4&loc=UTC"
      REDIS_ADDR: redis:6379
      HTTP_ADDR: :8080
      UPDATE_STATE_DIR: /var/lib/tg-guard-updates
    volumes:
      - ./.updates:/var/lib/tg-guard-updates
    ports:
      - "${PANEL_BIND:-127.0.0.1}:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [backend]
volumes:
  mysql_data:
  redis_data:
networks:
  backend:
