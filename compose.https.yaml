# Requires Docker Compose >= 2.24.4 (the installer installs the current plugin).
services:
  app:
    environment:
      TRUSTED_PROXY_CIDRS: ${TG_PROXY_IP:-172.31.249.2}/32
    ports: !override ["127.0.0.1:8080:8080"]
  https:
    image: caddy:2
    restart: unless-stopped
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:?Set PANEL_DOMAIN to your DNS domain}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      backend:
        ipv4_address: ${TG_PROXY_IP:-172.31.249.2}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
networks:
  backend:
    ipam:
      config:
        - subnet: ${TG_NETWORK_SUBNET:-172.31.249.0/24}
